# Local production-like stack: Postgres + FastAPI + Streamlit.
#
# Verified locally on 2026-08-16 — `docker compose up` runs all three services
# healthy and the API serves the full flow on PostgreSQL (ADR-023). This is a
# LOCAL container run; nothing here has been deployed to a cloud provider.
#
#   docker compose up -d --build
#   API http://localhost:8000/docs   UI http://localhost:8501
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sentineliq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: sentineliq
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so the test suite on the host can run against this database.
      # 5433, not 5432: a PostgreSQL installed natively on the developer's
      # machine holds 5432, and the host would silently reach that one instead.
      # The api and ui containers use db:5432 on the compose network regardless.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentineliq -d sentineliq"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sentineliq:${POSTGRES_PASSWORD:-changeme}@db:5432/sentineliq
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-SentinelIQ contact@example.com}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # JSON log lines carrying the NFR-006 metadata fields. On by default in
      # a container, where something is collecting the logs.
      LOG_STRUCTURED: ${LOG_STRUCTURED:-true}
      # Absolute path on the mounted volume below. Without this the uploads go
      # to a relative path inside the container and are lost on restart, while
      # their database rows survive.
      SENTINELIQ_UPLOAD_DIR: /var/lib/sentineliq/uploads
      # Half precision is a GPU optimisation; leave it on locally where a GPU
      # may exist, and set it false on a CPU host.
      RETRIEVAL_FP16: ${RETRIEVAL_FP16:-true}
      # Off unless this is exactly true/1/yes. When on, a request with no
      # bearer token is served as a fixed demo principal (analyst role, never admin)
      # in the demo tenant below, so an interviewer can use the app without an
      # account. JWT, RBAC and tenant isolation are unchanged; a request that DOES
      # carry a token is still authenticated by it.
      # Default is true here so `docker compose up` works for a local showcase
      # without exporting the variable first. Set false (or override in .env) to
      # require authentication on every request.
      SENTINELIQ_DEMO_MODE: ${SENTINELIQ_DEMO_MODE:-true}
      SENTINELIQ_DEMO_TENANT: ${SENTINELIQ_DEMO_TENANT:-demo-tenant}
      # CrewAI ships telemetry on by default and exports spans to its own
      # collector. We do not want outbound data we never asked for, and the
      # failing exports flooded the logs. This is the variable crewai 1.15.16
      # actually reads (with OTEL_SDK_DISABLED and CREWAI_DISABLE_TRACKING);
      # the older CREWAI_TELEMETRY_OPT_OUT is not read at all on this version.
      # OTEL_SDK_DISABLED is deliberately NOT used: it is a global
      # OpenTelemetry switch and would also silence LangSmith tracing.
      CREWAI_DISABLE_TELEMETRY: "true"
    ports:
      - "8000:8000"
    volumes:
      # Model cache, so a restart does not re-download the embedder+reranker.
      - hfcache:/cache/huggingface
      # Uploaded documents, which must outlive the container.
      - uploads:/var/lib/sentineliq/uploads

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      SENTINELIQ_API_URL: http://api:8000
    ports:
      - "8501:8501"

volumes:
  pgdata:
  hfcache:
  uploads:
