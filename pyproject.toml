[project]
name = "sentineliq"
version = "0.1.0"
description = "AI-powered enterprise due-diligence and decision-intelligence platform"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentineliq*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sentineliq"]

# Experiment scripts only. They must set HF env vars before importing
# transformers (E402), and their console report lines are wide by nature
# (E501). Production code under sentineliq/ gets no such exemption.
[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["E402", "E501"]
# `Depends(...)` in a default argument is FastAPI's documented idiom, not the
# mutable-default mistake B008 exists to catch.
"sentineliq/components/api/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["sentineliq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"